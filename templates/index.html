<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSPBU Semarang</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="peta-page">
    <header class="top-navbar">
        <div class="brand">
            <div class="brand-logo">G</div>
            <div class="brand-text">
                <span class="brand-name">GeoSPBU Semarang</span>
                <span class="brand-tag">Analisis SPBU</span>
            </div>
        </div>
        <div class="nav-center">
            <div class="nav-search">
                <input id="search-input" type="search" placeholder="Cari SPBU..." />
                <button id="search-button" class="nav-search-btn">Cari</button>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/">Beranda</a>
            <a href="/peta" class="active">Peta</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/tentang">Tentang</a>
        </nav>
    </header>

    <main class="app-shell">
        <section class="map-section">
            <div class="map-status-floating">
                <span id="map-status">Memuat data peta...</span>
            </div>
            <div id="loading-overlay" class="loading-overlay">
                <div class="spinner"></div>
                <span>Memuat data...</span>
            </div>
            <div id="map"></div>

            <div id="layer-control" class="layer-control">
                <div class="layer-header">🗺️ Tampilan Peta</div>
                <div class="layer-body">
                    <label class="layer-item"><input type="checkbox" id="chk-spbu" checked> <span class="layer-icon spbu">📍</span> <span class="layer-label">SPBU Eksisting</span></label>
                    <div class="layer-filter-panel layer-panel">
                        <div class="filter-group">
                            <label for="kecamatan-dropdown-toggle">Kecamatan</label>
                            <div class="kecamatan-dropdown-wrapper">
                                <button id="kecamatan-dropdown-toggle" class="kecamatan-toggle" type="button" aria-expanded="false">
                                    <span id="kecamatan-selected">Semua</span>
                                    <span class="dropdown-arrow">▾</span>
                                </button>
                                <div id="kecamatan-dropdown" class="kecamatan-dropdown hidden" role="listbox" aria-labelledby="kecamatan-dropdown-toggle">
                                    <button type="button" class="kecamatan-option active" data-value="Semua">Semua</button>
                                </div>
                            </div>
                            <input type="hidden" id="kecamatan-filter" value="Semua" />
                        </div>
                        <button id="reset-filters" class="filter-reset-button">Reset Filter</button>
                    </div>
                    <label class="layer-item"><input type="checkbox" id="chk-zona"> <span class="layer-icon zona">🚦</span> <span class="layer-label">Kepadatan Lalu Lintas</span></label>
                    <label class="layer-item"><input type="checkbox" id="chk-access"> <span class="layer-icon access">🔍</span> <span class="layer-label">Analisis Aksesibilitas</span></label>
                    <label class="layer-item"><input type="checkbox" id="chk-rekom"> <span class="layer-icon rekom">⭐</span> <span class="layer-label">Rekomendasi Lokasi <span class="badge">UTAMA</span></span></label>
                </div>
            </div>
            <div class="action-buttons"></div>
        </section>
        <div id="panel-rekomendasi" class="panel-rekomendasi hidden">
            <div class="panel-header">
                <strong>Detail Rekomendasi</strong>
                <button id="close-panel" class="close-panel">✕</button>
            </div>
            <div id="panel-content" class="panel-content"></div>
        </div>
    </main>

    <footer class="page-footer">
        <span>GeoSPBU Semarang &ndash; Dibuat oleh Tim Pemrograman Komputer Kelompok D</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
