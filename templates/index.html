<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSPBU Semarang</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <header class="top-navbar">
        <div class="brand">
            <div class="brand-logo">G</div>
            <div class="brand-text">
                <span class="brand-name">GeoSPBU Semarang</span>
                <span class="brand-tag">Analisis SPBU dan Mobilitas</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/">Beranda</a>
            <a href="/peta" title="Lihat peta utama" class="active">Peta</a>
            <a href="/dashboard" title="Buka dashboard statistik">Dashboard</a>
            <a href="/tentang" title="Pelajari metodologi aplikasi">Tentang</a>
        </nav>
    </header>

    <main class="app-shell">
        <section class="map-section">
            <div class="map-controls">
                <div class="search-panel">
                    <input id="search-input" type="search" placeholder="Nama atau alamat SPBU" title="Cari SPBU berdasarkan nama atau alamat" />
                    <button id="search-button" class="search-button" title="Cari SPBU di peta">Cari</button>
                </div>

                <div class="filter-panel">
                    <button id="toggle-filter-btn" class="filter-toggle-button" title="Tampilkan filter SPBU">
                        <span class="filter-icon">⚙</span>
                    </button>
                    <div id="filter-dropdown" class="filter-dropdown hidden" aria-expanded="false">
                        <div class="filter-group">
                            <label for="brand-filter">Brand</label>
                            <select id="brand-filter" title="Filter SPBU berdasarkan brand">
                                <option value="Semua">Semua</option>
                                <option value="Pertamina">Pertamina</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="kecamatan-filter">Kecamatan</label>
                            <select id="kecamatan-filter" title="Filter SPBU berdasarkan kecamatan">
                                <option value="Semua">Semua</option>
                            </select>
                        </div>
                        <button id="reset-filters" class="filter-reset-button" title="Reset filter">Reset Filter</button>
                    </div>
                </div>
            </div>

            <div class="map-status-floating">
                <span id="map-status">Memuat data peta...</span>
            </div>

            <div id="loading-overlay" class="loading-overlay">
                <div class="spinner"></div>
                <span>Memuat data...</span>
            </div>
            <div id="map"></div>

            <div class="action-buttons">
                <button id="toggle-access" class="action-button" title="Tampilkan atau sembunyikan analisis aksesibilitas">
                    <span class="button-icon button-icon-access">🧭</span>
                    Analisis Aksesibilitas
                </button>
                <a href="/dashboard" class="action-button action-link" title="Buka dashboard statistik">
                    <span class="button-icon button-icon-dashboard">📊</span>
                    Dashboard Statistik
                </a>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <span>GeoSPBU Semarang &ndash; Dibuat oleh Tim Pemrograman Komputer Kelompok D</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
