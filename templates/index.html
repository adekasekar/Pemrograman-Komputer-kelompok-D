<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSPBU Semarang</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="peta-page">
    <header class="top-navbar">
        <div class="brand">
            <div class="brand-logo">G</div>
            <div class="brand-text">
                <span class="brand-name">GeoSPBU Semarang</span>
                <span class="brand-tag">Analisis SPBU dan Mobilitas</span>
            </div>
        </div>
        <div class="nav-center">
            <div class="nav-search">
                <input id="search-input" type="search" placeholder="Cari SPBU..." />
                <button id="search-button" class="nav-search-btn">Cari</button>
            </div>
            <div class="filter-panel">
                <button id="toggle-filter-btn" class="filter-toggle-button" title="Filter SPBU">
                    <span class="filter-icon">⚙</span>
                </button>
                <div id="filter-dropdown" class="filter-dropdown hidden" aria-expanded="false">
                    <div class="filter-group">
                        <label for="kecamatan-filter">Kecamatan</label>
                        <select id="kecamatan-filter">
                            <option value="Semua">Semua</option>
                        </select>
                    </div>
                    <button id="reset-filters" class="filter-reset-button">Reset Filter</button>
                </div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/">Beranda</a>
            <a href="/peta" class="active">Peta</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/tentang">Tentang</a>
        </nav>
    </header>

    <main class="app-shell">
        <section class="map-section">
            <div class="map-status-floating">
                <span id="map-status">Memuat data peta...</span>
            </div>
            <div id="loading-overlay" class="loading-overlay">
                <div class="spinner"></div>
                <span>Memuat data...</span>
            </div>
            <div id="map"></div>
            <div class="action-buttons"></div>
        </section>
        <div id="panel-rekomendasi" class="panel-rekomendasi hidden">
            <div class="panel-header">
                <strong>Detail Rekomendasi</strong>
                <button id="close-panel" class="close-panel">✕</button>
            </div>
            <div id="panel-content" class="panel-content"></div>
        </div>
    </main>

    <footer class="page-footer">
        <span>GeoSPBU Semarang &ndash; Dibuat oleh Tim Pemrograman Komputer Kelompok D</span>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
